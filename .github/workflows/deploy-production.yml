name: Deploy HHG BI Suite to Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Confirm that the tested version is ready for production'
        required: true
        type: choice
        options:
          - 'NO - cancel deployment'
          - 'YES - deploy to production'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish tested version
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_deploy == 'YES - deploy to production'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required BI Suite files
        shell: bash
        run: |
          set -e
          test -f index.html || { echo "Missing index.html"; exit 1; }
          test -f config.js || { echo "Missing config.js"; exit 1; }
          test -f importer.js || { echo "Missing importer.js"; exit 1; }
          echo "Required BI Suite files are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
