<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HHG BI SUITE</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10242B;--sea:#0E7C86;--sun:#F2B134;--bg:#F2F5F6;--line:#DDE5E8;--mut:#5E7480;--up:#157F5B;--dn:#B03A2E}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}button,select,input{font:inherit}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mut)}.up,.dn{font-weight:700}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
.login-links{display:flex;justify-content:flex-end;margin-top:8px;font-size:12.5px}.login-links a{color:var(--sea);text-decoration:none;cursor:pointer}.login-links a:hover{text-decoration:underline}
#passwordGate{position:fixed;inset:0;z-index:99998;background:rgba(16,36,43,.72);display:grid;place-items:center;padding:20px}#passwordGate .box{max-width:420px;box-shadow:0 16px 48px rgba(0,0,0,.25)}#passwordGate .btn{width:100%}
.box{background:#fff;border-radius:10px;padding:32px;width:100%;max-width:380px}
.box h1{margin:0;font-size:24px;text-align:center}.box p{text-align:center;color:var(--mut);margin:4px 0 8px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:hover{background:var(--sea)}.btn:disabled{opacity:.5}
.err{color:var(--dn);font-size:13px;min-height:18px}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{background:var(--ink);color:#cfe0e4;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{color:#fff;font-weight:800;font-size:19px;padding:0 10px 16px}.brand b{color:var(--sun)}
.nav{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer}
.nav:hover{background:#1b3640}.nav.on{background:var(--sea);color:#fff;font-weight:700}
.who{margin-top:auto;font-size:12px;padding:0 10px;word-break:break-all}.who a{color:var(--sun);cursor:pointer;display:block;margin-top:6px}
main{padding:0 28px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px}.clock{text-align:right;font-weight:700}.clock small{display:block;color:var(--mut);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}.bar>div{min-width:130px}.bar label{margin:0 0 3px}
.tab{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}.tab.on{background:var(--sea);color:#fff;border-color:var(--sea);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.c{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.c small{color:var(--mut);font-weight:700}.c b{display:block;font-size:24px;font-weight:800}.c i{font-style:normal;color:var(--mut);font-size:12.5px;display:block}
.p{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;overflow-x:auto}.p h3{margin:0 0 10px;font-size:15px}
/* Keep long reservation summaries compact; scroll within each card. */
.res-scroll-card{height:520px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.res-scroll-card h3{flex:0 0 auto}
.res-scroll-card .res-table-scroll{overflow:auto;min-height:0;flex:1}
.res-scroll-card table{width:100%}
.res-scroll-card thead th{position:sticky;top:0;background:#fff;z-index:2}
.res-scroll-card .res-table-scroll::-webkit-scrollbar{width:10px;height:10px}
.res-scroll-card .res-table-scroll::-webkit-scrollbar-thumb{background:#c9d5da;border-radius:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}.two>.p{margin:0}.two{margin-bottom:16px}
.ch{position:relative;height:340px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-size:13px}tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.bx{display:inline-block;height:7px;border-radius:3px;background:var(--dn);vertical-align:middle;margin-left:8px}
pre{background:var(--ink);color:#cfe0e4;padding:12px;border-radius:6px;min-height:70px;white-space:pre-wrap;font-size:13px}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #C9D5DA;border-radius:999px;padding:3px 12px;white-space:nowrap}.pill.act{border-color:var(--sea);background:#EAF5F6}
.pill select{width:auto;border:0;background:transparent;padding:5px 2px;font-weight:700}.cb{border:0;background:none;padding:5px 2px;cursor:pointer;color:var(--ink)}
.rst{background:none;border:1px solid #C9D5DA;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--mut);cursor:pointer}
.chipw{position:relative}

/* Daily booking/cancellation grid */
.ov{position:fixed;inset:0;background:rgba(16,36,43,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.dlg{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:980px;max-height:85vh;overflow:auto}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dh h3{margin:0;font-size:17px}
.dd{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.dd th,.dd td{padding:3px 5px;text-align:center;font-size:13px;line-height:1.4;border-bottom:0;white-space:nowrap;background:#fff}
.dd th{background:#F7F9FA;color:var(--mut);text-align:center;font-size:12px}.dd td.n{min-width:56px}
.dd .f{position:sticky;left:0;z-index:2;min-width:130px;text-align:left;vertical-align:top}
.dd .m{position:sticky;left:130px;z-index:2;min-width:90px;text-align:left;color:var(--mut);border-right:2px solid var(--line)}
.dd .end{border-bottom:1px solid var(--line)}.dd .al{background:#EEF6F7}.dd .t{border-left:2px solid var(--line);font-weight:700}.dd th.f,.dd th.m{background:#F7F9FA}
.cb3{border:0;background:none;padding:2px 4px;cursor:pointer;color:inherit;font:inherit;border-radius:4px}.cb3:hover{background:#D5EBED}
.daygrid-scroll{overflow-x:auto;max-width:100%;}
.pop{position:absolute;top:46px;left:0;z-index:20;width:330px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 30px rgba(16,36,43,.2)}
.ph{display:flex;gap:8px;align-items:center;margin-bottom:12px}.ps{display:flex;flex:1;border:1px solid #C9D5DA;border-radius:8px;overflow:hidden}.ps select{border:0;border-radius:0}
.nb{width:38px;height:38px;border:1px solid #C9D5DA;border-radius:8px;background:#fff;font-size:18px;cursor:pointer}
.wk,.gd{display:grid;grid-template-columns:repeat(7,1fr)}.wk span{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.dy{height:36px;border:0;background:none;cursor:pointer;border-radius:8px;color:var(--ink)}
.dy.in{background:#DCEFF1;color:#0B5B63;border-radius:0}.dy.ed{background:var(--sea);color:#fff;font-weight:700}.dy.ed.st:not(.en){border-radius:8px 0 0 8px}.dy.ed.en:not(.st){border-radius:0 8px 8px 0}
.sl{margin:12px 0;font-size:13px;color:var(--mut);text-align:center}.pa{display:flex;gap:10px}.pa button{flex:1;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}
.cn{background:#fff;border:1px solid #C9D5DA;color:var(--ink)}.ap{background:var(--sea);border:1px solid var(--sea);color:#fff}.ap:disabled{opacity:.4;cursor:not-allowed}
.dm{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}.dm th,.dm td{text-align:center;min-width:64px;padding:9px 8px;font-size:15px}
.dm th{background:#F7F9FA;font-size:12px}.dm small{display:block;color:var(--mut);font-size:12px}.dm small.up{color:var(--up)}.dm small.dn{color:var(--dn)}
.dm .f{position:sticky;left:0;background:#fff;text-align:left;min-width:200px;z-index:1;border-right:2px solid var(--line)}.dm th.f{background:#F7F9FA}
.dm .now{background:#E3F2F3}.dm .no{background:#FFF4D6}.dm .no small{color:#8A5A00}.dm .tr td{border-top:2px solid var(--ink)}
.dm .sub{display:none}.dm.open .sub{display:table-row}.dm .sub .f{padding-left:26px;background:#FAFCFC}.dm .sub td{font-size:14px}
.lb{cursor:pointer;border:0;background:none;font-weight:700;padding:0}.lb::before{content:'▸ '}.dm.open .lb::before{content:'▾ '}
/* Upload & logs refresh */
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.upload-card,.summary-card,.log-card,.users-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:16px;min-width:0}
.upload-card h3,.summary-card h3,.log-card h3,.users-card h3{margin:0 0 12px;font-size:15px}
.upload-field{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px dashed #b8cbd1;border-radius:7px;padding:12px;margin:8px 0 12px;color:var(--mut);background:#fff;cursor:pointer}
.user-create{padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;background:#f8fbfc}.user-create h4{margin:0 0 10px}.user-create-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}.user-create-fields>div{min-width:0}.user-create-fields input,.user-create-fields select,.user-role{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.user-create-fields label{display:block;margin-bottom:5px;font-size:12px;color:var(--mut)}.user-table-wrap{max-width:100%;overflow-x:auto}.user-table-wrap table{min-width:560px}.user-role{min-width:100px}.user-save{padding:7px 10px;white-space:nowrap}/* Small auto-dismissing confirmation toast */
#toastHost{position:fixed;top:18px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 28px));pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-radius:9px;background:#fff;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--up);box-shadow:0 8px 26px rgba(16,36,43,.18);font-size:13px;line-height:1.4;animation:toastIn .18s ease-out;transition:opacity .22s,transform .22s}
.toast.error{border-left-color:var(--dn)}.toast .toast-mark{font-weight:800;color:var(--up)}.toast.error .toast-mark{color:var(--dn)}.toast.hide{opacity:0;transform:translateX(12px)}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:760px){.user-create-fields{grid-template-columns:1fr}}
.upload-field span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload-field input{width:auto;max-width:52%;padding:0;border:0;background:transparent;color:var(--mut)}
.upload-field input::file-selector-button{display:none}
.upload-field:focus-within,.upload-field:hover{border-color:var(--sea);background:#f8fcfc}
.admin-select{margin-bottom:12px}.admin-select label,.date-filter label{margin:0 0 5px}
.admin-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.admin-summary .c{padding:13px}.admin-summary .c b{font-size:23px}
.log-filter{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.log-filter>div{min-width:145px}
.log-pager{display:flex;align-items:center;justify-content:flex-start;gap:9px;flex-wrap:wrap;padding:12px 0;position:sticky;left:0;background:var(--card)}.log-pager button{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer;font-size:18px}.log-pager button:disabled{opacity:.35;cursor:not-allowed}.log-pager select{width:auto;min-width:100px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}.log-page-count{font-size:12px;color:var(--mut)}#logbox{max-height:420px;overflow:auto;min-width:0}#logbox table{min-width:850px;width:max-content;max-width:none}.log-card table td,.log-card table th{font-size:13px}
.log-card table th:first-child,.log-card table td:first-child{min-width:180px;text-align:left}
.log-card table th:nth-child(2),.log-card table td:nth-child(2){min-width:170px}
.log-card table th:last-child,.log-card table td:last-child{min-width:180px;white-space:normal}
.status-ok{color:var(--up);font-weight:700}.status-error{color:var(--dn);font-weight:700}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.upload-field{align-items:flex-start;flex-direction:column}.upload-field input{max-width:100%}#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.who{width:100%;margin:0}main{padding:0 14px 20px}.pop{position:fixed;left:12px;right:12px;top:150px;width:auto}.two{grid-template-columns:1fr}}

/* Compact themed confirmation dialog */
.confirm-backdrop{position:fixed;inset:0;background:rgba(16,36,43,.38);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
.confirm-dialog{width:min(100%,390px);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(16,36,43,.22);overflow:hidden}
.confirm-dialog-head{padding:15px 18px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;color:var(--ink)}
.confirm-dialog-body{padding:16px 18px;color:var(--mut);font-size:13px}
.confirm-dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.confirm-dialog-actions button{border-radius:7px;padding:8px 14px;border:1px solid var(--line);cursor:pointer;font-weight:700}
.confirm-dialog-actions .confirm-cancel{background:transparent;color:var(--ink)}
.confirm-dialog-actions .confirm-ok{background:var(--sea);border-color:var(--sea);color:#fff}
.confirm-dialog-actions button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}


/* Uniform property dropdown */
.prop-filter {
  position: relative;
  display: flex;
  align-items: center;
  width: 200px;
  min-width: 200px;
  flex: 0 0 200px;
}

.prop-filter-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-width: 0;
  height: 40px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.prop-filter-toggle .prop-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.prop-filter-toggle .prop-arrow {
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg) translateY(-2px);
  transition: transform .15s;
}

.prop-filter-toggle[aria-expanded="true"] .prop-arrow {
  transform: rotate(225deg) translateY(-1px);
}

.prop-filter-menu {
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  z-index: 1000;
  width: 320px;
  max-width: min(320px, calc(100vw - 32px));
  max-height: 360px;
  overflow-y: auto;
  padding: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(16,36,43,.15);
}

.prop-filter-actions {
  display: flex;
  gap: 6px;
  position: sticky;
  top: -10px;
  padding: 4px 0 9px;
  margin-bottom: 5px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}

.prop-filter-actions button,
.prop-filter-run {
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  font: inherit;
  font-weight: 700;
}

.prop-filter-run {
  flex: 1;
  background: var(--sea);
  color: #fff;
  border-color: var(--sea);
}

.prop-filter-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 4px;
  margin: 0;
  font-weight: 500;
  cursor: pointer;
}

.prop-filter-item input {
  flex: 0 0 auto;
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--sea);
}

.prop-filter-item .prop-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

@media(max-width:760px) {
  .prop-filter-menu {
    position: fixed;
    top: 145px;
    left: 12px;
    right: 12px;
    width: auto;
    max-width: none;
  }
}

/* Claude-inspired compact report filter styling */
.bar {
  align-items: center;
  gap: 9px;
}
.bar > div {
  min-width: 0;
}
.prop-filter {
  width: 200px;
  min-width: 200px;
  flex: 0 0 200px;
}
.prop-filter-toggle {
  height: 38px;
  padding: 6px 12px;
  border-radius: 999px;
  border-color: #D2DEE3;
  background: #fff;
  font-size: 13px;
}
.prop-filter-toggle:hover {
  border-color: var(--sea);
  background: #fff;
}
.prop-filter-toggle .prop-label {
  font-weight: 700;
}
/* Oval inline filters for Dashboard and Compare */
.filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  min-width: 0;
  padding: 3px 12px;
  border: 1px solid #D2DEE3;
  border-radius: 999px;
  background: #fff;
  color: var(--mut);
  white-space: nowrap;
  font-size: 13px;
}
.filter-pill select {
  width: auto;
  min-width: 0;
  max-width: 150px;
  padding: 4px 18px 4px 0;
  border: 0;
  border-radius: 0;
  outline-offset: 2px;
  background: transparent;
  color: var(--ink);
  font-weight: 700;
  cursor: pointer;
}
.filter-pill select:focus-visible { outline: 2px solid var(--sea); }
.prop-filter-menu {
  top: calc(100% + 7px);
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 12px 32px rgba(16,36,43,.18);
}
.prop-filter-actions button {
  border-radius: 999px;
  white-space: nowrap;
  font-size: 12px;
}
.prop-filter-run {
  border-radius: 999px !important;
}
.prop-filter-item {
  border-radius: 6px;
  font-size: 13px;
}
.prop-filter-item:hover {
  background: #F2F8F9;
}
.p, .c {
  border-radius: 9px;
}
.tab {
  border-radius: 999px;
}
.pill {
  min-height: 38px;
  border-color: #D2DEE3;
}
.rst {
  min-height: 38px;
}
@media(max-width:760px) {
  .prop-filter {
    width: 100%;
    min-width: 0;
    flex: 1 1 100%;
  }
}

/* Responsive KPI cards with clean line icons */
.c {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 26px;
  column-gap: 10px;
  align-items: center;
  padding: 14px 16px;
  min-width: 0;
  container-type: inline-size;
}

.kpi-content {
  grid-column: 1;
  min-width: 0;
}

.kpi-content small,
.kpi-content b,
.kpi-content i {
  display: block;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.kpi-content small {
  color: var(--mut);
  font-weight: 700;
  line-height: 1.4;
}

.kpi-content b {
  font-size: clamp(16px, 8cqi, 24px);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.kpi-content i {
  font-style: normal;
  color: var(--mut);
  font-size: clamp(10px, 4.2cqi, 12.5px);
  line-height: 1.65;
}

.kpi-icon {
  grid-column: 2;
  grid-row: 1;
  align-self: center;
  justify-self: center;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sea);
  background: transparent;
  border: 0;
  border-radius: 0;
}

.kpi-icon svg {
  display: block;
  width: 24px;
  height: 24px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (max-width: 760px) {
  .c {
    padding: 12px;
    column-gap: 6px;
    grid-template-columns: minmax(0, 1fr) 22px;
  }

  .kpi-icon {
    width: 22px;
    height: 22px;

<script>
const sb = supabase.createClient(CFG.url, CFG.key);
const $ = s => document.querySelector(s);
function toast(message, type='success', duration=3200){
  const host=$('#toastHost'); if(!host)return;

  const mark=document.createElement('span'); mark.className='toast-mark'; mark.textContent=type==='error'?'!':'✓';
  const text=document.createElement('span'); text.textContent=message;
  item.append(mark,text); host.append(item);
  window.setTimeout(()=>{item.classList.add('hide');window.setTimeout(()=>item.remove(),260);},duration);
}
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt = n => n==null||isNaN(n) ? '–' : Math.round(n).toLocaleString('en-PH');
const php = n => n==null||isNaN(n) ? '–' : '₱'+fmt(n);
const pct = n => n==null||isNaN(n) ? '–' : (n*100).toFixed(1)+'%';
const pad = n => String(n).padStart(2,'0');
const dim = (y,m) => new Date(y,m,0).getDate();
const today = () => new Date(Date.now()+8*36e5).toISOString().slice(0,10);
const S = {role:'viewer',user:null,props:[],pm:{},adr:[],res:[],pace:[],view:'dash',f:{},rg:{book:null,cin:null,cout:null},pk:{open:null},po:0,ex:false,logDate:today(),logPage:1,selectedProps:null,draftProps:null,propMenuOpen:false,dsrc:{},dd:null};
let charts = [];

/* clock */
function tick(){

  const d = n.toLocaleDateString('en-PH',{weekday:'long',day:'2-digit',month:'short',year:'numeric',...o});

tick(); setInterval(tick, 1000);

/* auth and password setup */
$('#em').value = '';
$('#pw').value = '';
$('#go').onclick = async () => {
  $('#lerr').textContent = '';
  const email=$('#em').value.trim(), password=$('#pw').value;
  if(!email||!password){$('#lerr').textContent='Enter your email and password.';return;}
  const btn=$('#go');btn.disabled=true;btn.textContent='Signing in…';
  const {data,error} = await sb.auth.signInWithPassword({email, password});
  btn.disabled=false;btn.textContent='Sign in';
  if (error) { $('#lerr').textContent = error.message; toast('Sign-in failed. Check your email and password.','error'); return; }
  const meta=data?.user?.user_metadata||{};
  const expiresAt=meta.temporary_password_expires_at ? Date.parse(meta.temporary_password_expires_at) : 0;
  if(meta.must_change_password===true && expiresAt && Date.now()>expiresAt){
    await sb.auth.signOut();
    $('#lerr').textContent='Your temporary password has expired. Please contact the HHG BI Suite administrator for a new one.';
    toast('Temporary password expired. Contact the administrator.','error',5000);
  }
};
$('#pw').onkeydown = e => { if (e.key==='Enter') $('#go').click(); };
$('#forgotLink').onclick = async () => {
  const email=$('#em').value.trim();
  if(!email){$('#lerr').textContent='Enter your email first, then click Forgot password?';$('#em').focus();return;}
  $('#lerr').textContent='';
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
  if(error){$('#lerr').textContent=error.message;toast('Could not send password reset email: '+error.message,'error');return;}
  toast('If that email is registered, a password reset link has been sent.');
};
function showPasswordGate(mode='first-login'){
  const recovery=mode==='recovery';
  const gate=$('#passwordGate');

  gate.innerHTML=`<div class="box"><h1>${recovery?'Reset password':'Create your password'}</h1><p>${recovery?'Choose a new password for your account.':'For security, set a new password before continuing.'}</p><form id="passwordForm"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter your password" required><div class="err" id="passwordErr"></div><button class="btn" id="saveNewPassword" type="submit">Save password</button></form></div>`;

  gate.hidden=false;

  $('#passwordForm').onsubmit=async e=>{
    e.preventDefault();

    const a=$('#newPassword').value;
    const b=$('#confirmPassword').value;
    const err=$('#passwordErr');
    const btn=$('#saveNewPassword');

    if(a.length<8){
      err.textContent='Password must be at least 8 characters.';
      return;
    }

    if(a!==b){
      err.textContent='Passwords do not match.';
      return;
    }

    btn.disabled=true;
    btn.textContent='Saving…';
    err.textContent='';

    const {data,error}=await sb.auth.updateUser({
      password:a,
      data:{must_change_password:false}
    });

    if(error){
      err.textContent=error.message;
      btn.disabled=false;
      btn.textContent='Save password';
      toast('Password could not be updated: '+error.message,'error');
      return;
    }

    if(data?.user) S.user=data.user;

    gate.hidden=true;
    gate.innerHTML='';
    $('#pw').value='';

    $('#login').hidden=true;
    $('#app').hidden=false;

    toast('Password updated successfully.');

    $('#view').innerHTML='<p class="mu">Loading…</p>';

    try{
      await load();
      show(S.view);
    }catch(error){
      $('#view').innerHTML='<p class="err">Dashboard failed to load. Please refresh the page.</p>';
      console.error(error);
    }
  };
}
$('#out').onclick = () => sb.auth.signOut();
let cur = null;
sb.auth.onAuthStateChange((event, s) => {
  if(event==='PASSWORD_RECOVERY' && s){cur=s.user.id;setTimeout(()=>showPasswordGate('recovery'),0);return;}
  if (!s){ cur=null; S.user=null; $('#app').hidden=true; $('#login').hidden=false; $('#passwordGate').hidden=true; $('#em').value='';$('#pw').value=''; return; }
  const meta=s.user.user_metadata||{};
  const expiresAt=meta.temporary_password_expires_at ? Date.parse(meta.temporary_password_expires_at) : 0;
  if(meta.must_change_password===true && expiresAt && Date.now()>expiresAt){
    cur=null;
    setTimeout(async()=>{
      await sb.auth.signOut();
      $('#lerr').textContent='Your temporary password has expired. Please contact the HHG BI Suite administrator for a new one.';
      toast('Temporary password expired. Contact the administrator.','error',5000);
    },0);
    return;
  }
  if (cur===s.user.id) return;
  cur = s.user.id; setTimeout(() => start(s.user), 0);
});
async function fetchAll(t, mod){
  let out=[], from=0;
  for(;;){
    let q = sb.from(t).select('*'); if (mod) q = mod(q);
    const {data,error} = await q.range(from, from+999);
    if (error) throw error;
    out.push(...data); if (data.length<1000) return out; from += 1000;
  }
}
async function start(user){
  S.user = user;

  const meta = user.user_metadata || {};
  const expiresAt = meta.temporary_password_expires_at
    ? Date.parse(meta.temporary_password_expires_at)
    : 0;

  // Block expired temporary passwords
  if (
    meta.must_change_password === true &&
    expiresAt &&
    Date.now() > expiresAt
  ) {
    await sb.auth.signOut();
    $('#lerr').textContent =
      'Your temporary password has expired. Please contact the HHG BI Suite administrator for a new one.';
    toast('Temporary password expired. Contact the administrator.', 'error', 5000);
    return;
  }

  // Load profile and role
  const {data:p, error:profileError} = await sb
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .maybeSingle();

  if (profileError) {
    $('#lerr').textContent = profileError.message;
    return;
  }

  S.role = p?.role || 'viewer';

  $('#me').textContent = user.email + ' (' + S.role + ')';
  $('#navAdmin').hidden = $('#navUsers').hidden = S.role !== 'admin';

  $('#acc').textContent =
    S.role !== 'admin' && (p?.view_from || p?.view_to)
      ? 'Your access: ' + (p.view_from || 'start') + ' to ' + (p.view_to || 'latest')
      : '';

  $('#login').hidden = true;
  $('#app').hidden = false;

  // Force password change BEFORE loading dashboard data
  if (meta.must_change_password === true) {
    $('#view').innerHTML = '';
    showPasswordGate('first-login');
    return;
  }

  $('#view').innerHTML = '<p class="mu">Loading…</p>';
  await load();
  show(S.view);
}
function sourceCategory(value){
  const s=String(value||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!s) return 'Direct';
  // Direct channels must be checked first: "Website / Booking Engine" contains "Booking".
  if(/website|booking\s*engine|walk[ -]?in|direct|phone|telephone|email|whatsapp|facebook|instagram|call.?in/i.test(s)) return 'Direct';
  if(/booking\.com|agoda|priceline|expedia|airbnb|ctrip|trip\.com|traveloka|hotels?\.com|hostelworld|orbitz|hopper|makemytrip|hotelbeds|webbeds|ota/i.test(s)) return 'OTA';
  return 'Direct';
}
async function load(){
  try{
    const [rawProps, rawAdr, rawRes, rawPace, rawAdrHistory] = await Promise.all([
      fetchAll('properties'), fetchAll('adr_daily'), fetchAll('reservations'), fetchAll('pace_snapshots'),
      fetchAll('adr_history').catch(e => { console.warn('ADR history unavailable; using existing Pace snapshots.', e); return []; })
    ]);
    const codeByName = {
  'H Hotel': 'HHO',
  'S Resort': 'HSR',
  'Piece Lio': 'HPCL',
  'Nacpan Beach Resort': 'HNBR',
  'Nacpan Beach Glamping': 'HNBG',
  'Nacpan Beach Villas': 'HNBV',
  'Z Garden Hotel': 'HZG',
  'J Boutique Hotel': 'HJH',
  'Villa V': 'HVV'
};
    S.props = rawProps.map(p=>({...p, code:codeByName[p.name]||String(p.id), total_rooms:+p.rooms||0, active:true})).sort((a,b)=>(a.sort||0)-(b.sort||0));
    S.pm = Object.fromEntries(S.props.map(p=>[p.code,p]));
    const codeById = Object.fromEntries(S.props.map(p=>[String(p.id),p.code]));
    S.adr = rawAdr.map(r=>{const d=String(r.stay_date||'');return {property:codeById[String(r.property_id)],year:+d.slice(0,4),month:+d.slice(5,7),rooms_sold:+r.rooms_sold||0,room_revenue:+r.room_revenue||0,rooms_available:+r.rooms_available||0};}).filter(r=>r.property&&r.year&&r.month);
   S.res = rawRes.map(r => ({
  ...r,
  property: codeById[String(r.property_id)],
  room_nights: +r.nights || 0,
  grand_total: +r.revenue || 0,
  suggested_deposit: +r.suggested_deposit || 0,
  source_category: r.source_category || sourceCategory(r.source),
  guest_name: r.guest_name || '',
  room_type: r.room_type || '',
  check_in: r.check_in,
  check_out: r.check_out,
  booking_date: r.booking_date,
  status: r.status || '',
  source: r.source || ''
})).filter(r => r.property);
    const adrPace = rawAdrHistory.map(r=>{
      const stay=String(r.stay_date||''), snap=String(r.snapshot_date||'');
      const property=codeById[String(r.property_id)], year_no=+stay.slice(0,4), month_no=+stay.slice(5,7);
      return {property,snapshot_date:snap,year_no,month_no,day:+snap.slice(8,10),ty_rooms_sold:+r.rooms_sold||0,ty_capacity:(S.pm[property]?.total_rooms||0)*dim(year_no,month_no)};
    }).filter(r=>r.property&&r.snapshot_date&&r.year_no&&r.month_no&&r.day);
    S.pace = adrPace.length ? adrPace : rawPace.map(r=>{const d=String(r.stay_date||'');return {property:codeById[String(r.property_id)],snapshot_date:r.snapshot_date,year_no:+d.slice(0,4),month_no:+d.slice(5,7),day:+d.slice(8,10),ty_rooms_sold:+r.room_nights||0,ty_capacity:(S.pm[codeById[String(r.property_id)]]?.total_rooms||0)*dim(+d.slice(0,4),+d.slice(5,7))};}).filter(r=>r.property&&r.snapshot_date&&r.year_no&&r.month_no&&r.day);
    return true;
  }catch(e){ $('#view').innerHTML = `<p class="err">Could not load data: ${e.message}</p>`; return false; }
}

const refreshBtn = document.getElementById('refreshData');

if (refreshBtn) {
  refreshBtn.addEventListener('click', async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Refreshing...';

    try {
      const ok = await load();
      if (!ok) throw new Error('Could not load data. Check the message on the page.');
      show(S.view);
      refreshBtn.textContent = '✓ Refreshed';
    } catch (error) {
      console.error('Refresh failed:', error);
      refreshBtn.textContent = 'Refresh Failed';
    }

    setTimeout(() => {
      refreshBtn.disabled = false;
      refreshBtn.textContent = '↻ Refresh Data';
    }, 2000);
  });
}
  
/* Shared property filter used across report pages */
function sharedPropertyFilter(){
  const selected = S.draftProps ??
    (S.selectedProps === null
      ? S.props.map(p => p.code)
      : [...S.selectedProps]);

  const all = S.props.length > 0 &&
    selected.length === S.props.length;

  const label = all
    ? 'All properties'
    : selected.length
      ? `${selected.length} properties selected`
      : 'No properties selected';

  return `
    <div class="prop-filter">
      <button
        type="button"
        class="prop-filter-toggle"
        data-a="toggleProps"
        aria-expanded="${S.propMenuOpen}"
      >
        <span class="prop-label">${label}</span>
        <span class="prop-arrow" aria-hidden="true"></span>
      </button>
      ${S.propMenuOpen ? `
        <div class="prop-filter-menu">
          <div class="prop-filter-actions">
            <button type="button" data-a="selectAllProps">All Hotels</button>
            <button type="button" data-a="clearProps">Clear</button>
            <button type="button" class="prop-filter-run" data-a="runProps">Run</button>
          </div>
          ${S.props.map(p => `
            <label class="prop-filter-item">
              <input type="checkbox" data-prop-check="${p.code}" ${selected.includes(p.code) ? 'checked' : ''}>
              <span class="prop-name">${p.name}</span>
            </label>
          `).join('')}
        </div>
      ` : ''}
    </div>`;
}

/* Shared property selection helpers */
const selectedCodes = () => S.selectedProps === null
  ? S.props.map(p => p.code)
  : S.selectedProps;
const filterSelected = cs => cs.filter(c => selectedCodes().includes(c));

/* shared helpers */
const V = {dash, compare, pace, res, cancel, admin, users};
function show(v){
  S.view = v; charts.forEach(c=>c.destroy()); charts = [];
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  V[v]();
  if (S.dd && v!=='admin' && v!=='users') $('#view').insertAdjacentHTML('beforeend', ddPop());
}
document.querySelectorAll('.nav').forEach(b => b.onclick = () => show(b.dataset.v));
const empty = m => { $('#view').innerHTML = `<p class="mu">${m}</p>`; };
const opts = (a,v) => a.map(([k,t])=>`<option value="${k}"${String(k)===String(v)?' selected':''}>${t}</option>`).join('');
const sel = (id,l,a,v) => `<div><label for="${id}">${l}</label><select id="${id}">${opts(a,v)}</select></div>`;
const propOpts = () => [['ALL','All properties'],...S.props.map(p=>[p.code,p.name])];
const years = () => [...new Set(S.adr.map(r=>r.year))].sort((a,b)=>b-a);
const codes = c => c==='ALL' ? S.props.map(p=>p.code) : [c];
const bind = (ks,fn) => ks.forEach(k => { const el=$('#'+k); if(el) el.onchange = e => { S.f[k]=e.target.value; fn(); }; });
const tbl = (h,rows,cls) => `<table${cls?` class="${cls}"`:''}><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
function filt(){ const f=S.f; f.year??=years()[0]; f.month??='ALL'; return f; }
const inlineFilter = (id, label, options, value) => `<div class="filter-pill"><span>${label}</span><select id="${id}" aria-label="${label}">${opts(options,value)}</select></div>`;
const filterBar = noMonth => {
  const f=filt();
  return `<div class="bar">${sharedPropertyFilter()}${inlineFilter('year','Year',years().map(y=>[y,y]),f.year)}${noMonth?'':inlineFilter('month','Month',[['ALL','All months'],...MN.map((m,i)=>[i+1,m])],f.month)}</div>`;
};
function agg(y, months, cs){
  let sold=0, rev=0, avail=0;
  for (const r of S.adr){
    if (r.year!=y || !months.includes(r.month) || !cs.includes(r.property)) continue;
    sold += +r.rooms_sold||0; rev += +r.room_revenue||0; avail += +r.rooms_available || 0;
  }
  return {sold, rev, avail, occ:avail?sold/avail:NaN, adr:sold?rev/sold:NaN, revpar:avail?rev/avail:NaN};
}
const monthsFor = (y,m,cs) => m!=='ALL' ? [+m] : [...new Set(S.adr.filter(r=>r.year==y && cs.includes(r.property) && (+r.rooms_sold||+r.room_revenue)).map(r=>r.month))];

function kc(t, a, b, f, pts) {
  const d = a - b;
  const g = b ? d / b : NaN;
  const c = isNaN(d) ? '' : d >= 0 ? 'up' : 'dn';
  const ar = d >= 0 ? '▲' : '▼';

  const dt = isNaN(d)
    ? ''
    : `${ar} ${pts
        ? (Math.abs(d) * 100).toFixed(1) + ' pts'
        : f(Math.abs(d))}${isNaN(g)
        ? ''
        : ' · ' + (Math.abs(g) * 100).toFixed(1) + '%'}`;

  const icons = {
    'Room revenue':
      '<circle cx="12" cy="12" r="9"/><path d="M12 7v10m4-7H10a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/>',

    'Occupancy':
      '<path d="M3 18v-7a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v6M3 14h10m0-3h5a3 3 0 0 1 3 3v4M5 9V6h4a2 2 0 0 1 2 2v1"/>',

    'ADR':
      '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>',

    'RevPAR':
      '<path d="M4 20V10m6 10V4m6 16v-7m6 7H2"/>',

    'Rooms sold':
      '<path d="M4 21V3h13v18M17 12h3v9M8 7h5m-5 4h5m-5 4h2"/>'
  };

  const icon = icons[t] || '';

  return `
    <div class="c">
      <div class="kpi-content">
        <small>${t}</small>
        <b>${f(a)}</b>
        <i>Last year ${f(b)}</i>
        <i class="${c}">${dt}</i>
      </div>
      <span class="kpi-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>
      </span>
    </div>`;
}

function mk(id, type, labels, sets, fm, horiz){
  charts.push(new Chart($(id), {type, data:{labels, datasets:sets},
    options:{indexAxis:horiz?'y':'x', maintainAspectRatio:false, interaction:{mode:'index',axis:horiz?'y':'x',intersect:false},
      plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fm(horiz?c.parsed.x:c.parsed.y)}}}, scales:{[horiz?'x':'y']:{ticks:{callback:v=>fm(v)}}}}}));
}
const ds = (label,data,c) => ({label, data, backgroundColor:c, borderColor:c});
const C1='#0E7C86', C2='#F2B134', C3='#10242B', mfmt = v => v>=1e6 ? (v/1e6).toFixed(1)+'M' : fmt(v);

/* Dashboard */
function dash(){
  $('#ttl').textContent = 'Dashboard';
  if (!S.adr.length) return empty('No data yet. An admin needs to upload the ADR reports.');
  const f=filt(), y=+f.year, cs=selectedCodes(), ms=monthsFor(y,f.month,cs), all=cs;
  const ty=agg(y,ms,cs), ly=agg(y-1,ms,cs), msA=monthsFor(y,f.month,all);
  const T = {occ:'Occupancy by property',rev:'Room revenue by property',adr:'ADR by property',rvp:'RevPAR by property'};

  const cx = rs.filter(Cn), N = cx.length, L = sum(cx,lost), nights = sum(rs,r=>+r.room_nights||0);

  const maxC = Math.max(1, ...WIN.map(w=>cx.filter(r=>wname(r)===w[0]).length));
  const winRows = WIN.map(w => { const a=cx.filter(r=>wname(r)===w[0]), v=sum(a,lost);
    return [w[0],fmt(a.length),`${pct(N?a.length/N:NaN)}<span class="bx" style="width:${a.length/maxC*160}px"></span>`,php(v),a.length?php(v/a.length):'–']; });
  winRows.push(['<b>Total</b>',fmt(N),'100%',php(L),N?php(L/N):'–']);
  const row = (name,a) => { const c=a.filter(Cn), v=sum(c,lost);
    return [name,fmt(a.length),fmt(c.length),`${pct(a.length?c.length/a.length:NaN)}<span class="bx" style="width:${a.length?c.length/a.length*160:0}px"></span>`,php(v),c.length?php(v/c.length):'–',c.length?Math.round(avgW(c))+' days':'–']; };
  const grp = k => { const m={}; rs.forEach(r=>(m[k(r)]??=[]).push(r)); return Object.entries(m); };
  const cats = grp(r=>r.source_category||'–').map(([n,a])=>row(`<b>${n}</b>`,a));
  const srcs = grp(r=>r.src).sort((a,b)=>sum(b[1].filter(Cn),lost)-sum(a[1].filter(Cn),lost)).map(([n,a])=>row(n,a));
  const srcList = grp(r=>r.src).filter(([,a])=>a.some(Cn)).map(x=>x[0]);
  const cell = n => n ? `<div style="margin:-8px -10px;padding:8px 10px;background:rgba(14,124,134,${(0.12+0.45*n/maxM).toFixed(2)})"><b>${n}</b></div>` : '<span class="mu">–</span>';
  const mcount = (s,w) => cx.filter(r=>r.src===s && wname(r)===w).length;
  const maxM = Math.max(1, ...srcList.flatMap(s=>WIN.map(w=>mcount(s,w[0]))));
  const mat = srcList.map(s => [s,...WIN.map(w=>cell(mcount(s,w[0]))),`<b>${cx.filter(r=>r.src===s).length}</b>`]);
  const top = [...cx].sort((a,b)=>lost(b)-lost(a)).slice(0,10).map(r=>[S.pm[r.property]?.name||r.property,r.src,r.room_type&&r.room_type!=='-'?r.room_type:'–',r.booking_date?fd(r.booking_date):'–',r.check_in?fd(r.check_in):'–',lead(r)==null?'–':lead(r)+' days',fmt(r.room_nights),`<span class="dn">${php(lost(r))}</span>`]);
  const srcOpts = [['ALL','All'],...[...new Set(all.map(r=>r.src))].sort().map(x=>[x,x])];
  const H = ['','Bookings','Cancelled','Cancel rate','Revenue lost','Average lost','Average window'];
  $('#view').innerHTML = `<div class="bar">${sharedPropertyFilter()}${chip('book','Booking date')}${chip('cin','Check-in date')}${spill('cs','Source',srcOpts,f.cs)}<button class="rst" data-a="rs">Reset filters</button></div>
  <p class="note" style="margin:-6px 0 16px">Window = days between the booking date and the check-in date. Revenue lost = the booking value before cancellation (Suggested Deposit, since cancelled bookings show a Grand Total of 0). The PMS export has no cancellation date, so the window shows how far ahead cancelled guests had booked.</p>
  ${cards}
  ${dayGrid(cx, {kind:'c',mkey:'cm',title:f.cg==='cin'?'Cancelled bookings by check-in day':'Cancelled bookings by booking day',dayLabel:f.cg==='cin'?'Check-in day':'Booking day',l0:'Cancelled',l2:'Value lost (₱)',vlabel:'Value lost',key:f.cg==='cin'?(r=>r.check_in):(r=>r.booking_date),val:lost,extra:spill('cg','Group by',[['book','Booking day'],['cin','Check-in day']],f.cg),note:'Each hotel shows cancelled bookings, their room nights and the revenue lost.'})}
  <div class="p"><h3>Cancellation window: how far ahead of check-in the cancelled bookings were made</h3>${tbl(['Window','Cancelled','Share','Revenue lost','Average lost'],winRows)}</div>
  <div class="p"><h3>By booking source (OTA and direct)</h3>${tbl(H.map((x,i)=>i?x:'Source'),[...cats,...srcs])}</div>

  bind(['cp','cs','cm','cg'], cancel);
}

function showUploadConfirm(message){
  return new Promise(resolve=>{
    const wrap=document.createElement('div');
    wrap.className='confirm-backdrop';
    wrap.innerHTML=`<section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="uploadConfirmTitle"><div class="confirm-dialog-head" id="uploadConfirmTitle">Confirm Upload</div><div class="confirm-dialog-body">${message}</div><div class="confirm-dialog-actions"><button type="button" class="confirm-cancel">Cancel</button><button type="button" class="confirm-ok">OK</button></div></section>`;
    const finish=value=>{wrap.remove();resolve(value);};
    wrap.querySelector('.confirm-cancel').onclick=()=>finish(false);
    wrap.querySelector('.confirm-ok').onclick=()=>finish(true);
    wrap.addEventListener('click',e=>{if(e.target===wrap)finish(false);});
    const onKey=e=>{if(e.key==='Escape'){document.removeEventListener('keydown',onKey);finish(false);}};
    document.addEventListener('keydown',onKey);
    wrap.querySelector('.confirm-cancel').addEventListener('click',()=>document.removeEventListener('keydown',onKey),{once:true});
    wrap.querySelector('.confirm-ok').addEventListener('click',()=>document.removeEventListener('keydown',onKey),{once:true});
    document.body.appendChild(wrap);
    wrap.querySelector('.confirm-ok').focus();
  });
}

  const logbox=$('#logbox'); if(!logbox)return; logbox.innerHTML=data.length?tableHtml+pager:'<p class="mu">No uploads on this day.</p>';

const chunked = async (fn,rows) => { for (let i=0;i<rows.length;i+=500){ const {error}=await fn(rows.slice(i,i+500)); if (error) throw error; } };
const logUp = o => sb.from('upload_log').insert({user_email:S.user.email,...o});

  const jobs=[];
  for(const file of files){
    try{
      const rows=await readRows(file), rep=Imp.detect(rows);

      jobs.push({rep,rows,file,generated:Imp.generatedAt(rows)||''});

      } else if(rep==='Reservations'){
        const r = Imp.parseRes(rows, prop.code);

console.log('RESERVATION IMPORT DIAGNOSTIC', {
  guestNamesFound: r.rows.filter(x => x.guest_name).length,

    .filter(x => String(x.reservation_no) === '2013029807870')
    .map(x => ({
      reservation_no: x.reservation_no,

    }))
});
        if(!r.rows.length)throw new Error('No reservations found in the file.');
        const mapped=r.rows.filter(x=>x.reservation_no).map(x=>({property_id:propertyId,reservation_no:String(x.reservation_no),booking_date:x.booking_date,check_in:x.check_in,check_out:x.check_out,nights:x.room_nights||0,revenue:x.grand_total||0,suggested_deposit:x.suggested_deposit||0,status:x.status||'',source:x.source||'',source_category:x.source_category||sourceCategory(x.source),guest_name:x.guest_name||null,room_type:x.room_type||null}));
        const skipped=r.rows.length-mapped.length;

        n=mapped.length;note=r.note+` (upserted; ${mapped.filter(x=>x.guest_name).length} with guest names; ${skipped} skipped: no reservation number; existing rows not deleted)`;
      } else if(rep==='Pace'){

        const mapped=r.rows.map(x=>({property_id:propertyId,snapshot_date:snap,stay_date:`${(+snap.slice(5,7)>x.month_no?+snap.slice(0,4)+1:+snap.slice(0,4))}-${pad(x.month_no)}-${pad(x.day)}`,room_nights:x.ty_rooms_sold||0}));

        n=mapped.length;note=`snapshot ${snap}`;

      const m=String(e.message||JSON.stringify(e));L(`${file.name} → ${rep}: ${m}`);

    }
  }

  if(error)return empty(error.message);
  const rows=(data||[]).map(u=>[u.email||'—',`<select class="user-role" data-user-id="${u.id}" ${u.id===S.user.id?'disabled':''}><option value="admin" ${(u.role||'viewer')==='admin'?'selected':''}>Admin</option><option value="viewer" ${(u.role||'viewer')==='viewer'?'selected':''}>Viewer</option></select>`,u.id===S.user.id?'Current user':`<button type="button" class="btn user-save" data-user-id="${u.id}">Save role</button>`]);
  $('#view').innerHTML=`<div class="p users-card"><h3>Users and access</h3><div class="user-create"><h4>Add account</h4><div class="user-create-fields"><div><label for="newUserEmail">Email</label><input id="newUserEmail" type="email" placeholder="name@company.com"></div><div><label for="newUserPassword">Temporary password</label><input id="newUserPassword" type="password" minlength="8" placeholder="At least 8 characters"></div><div><label for="newUserRole">Role</label><select id="newUserRole"><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div><button type="button" class="btn" id="createUser">Create account</button></div><p class="note">Creates the account in Supabase Auth and assigns the selected role.</p><p id="userActionMsg" class="note"></p></div><div class="user-table-wrap">${rows.length?tbl(['Email','Role','Action'],rows):'<p class="mu">No profiles found.</p>'}</div></div>`;
  $('#view').querySelectorAll('.user-save').forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.userId,role=$('#view').querySelector(`.user-role[data-user-id="${id}"]`)?.value;
    btn.disabled=true;btn.textContent='Saving…';
    const {error}=await sb.functions.invoke('admin-create-user',{body:{action:'update-role',user_id:id,role}});
    if(error){toast('Could not update role: '+error.message,'error');btn.disabled=false;btn.textContent='Save role';return;}
    btn.textContent='Saved'; toast('Role updated successfully.');
  });
  $('#createUser').onclick=async()=>{
    const email=$('#newUserEmail').value.trim().toLowerCase(),password=$('#newUserPassword').value,role=$('#newUserRole').value,msg=$('#userActionMsg');
    if(!email||password.length<8){msg.textContent='Enter a valid email and a password with at least 8 characters.';toast('Enter a valid email and a password with at least 8 characters.','error');return;}
    const btn=$('#createUser');btn.disabled=true;btn.textContent='Creating…';msg.textContent='';
    const {error}=await sb.functions.invoke('admin-create-user',{body:{email,password,role}});
    if(error){msg.textContent='Account creation failed: '+error.message;toast('Account creation failed: '+error.message,'error');btn.disabled=false;btn.textContent='Create account';return;}
    msg.textContent='Account created and invitation email sent. The temporary password expires in 24 hours; the user must change it at first login.'; toast('Account created and invitation email sent.');
    await users();
  };
}
/* clicks: filters, date picker, pace tabs */
const A = {
  toggleProps: () => { S.draftProps=S.draftProps??(S.selectedProps===null?S.props.map(p=>p.code):[...S.selectedProps]); S.propMenuOpen=!S.propMenuOpen; },
  selectAllProps: () => { S.draftProps=S.props.map(p=>p.code); },
  clearProps: () => { S.draftProps=[]; },
  runProps: () => { S.selectedProps=(S.draftProps??S.props.map(p=>p.code)).length===S.props.length?null:[...(S.draftProps??[])]; S.draftProps=null; S.propMenuOpen=false; },
  tg: k => { const p=S.pk; if (p.open===k){ p.open=null; return; } const r=S.rg[k], b=r?r.s:today(); Object.assign(p,{open:k,ds:r?r.s:null,de:r?r.e:null,vy:+b.slice(0,4),vm:+b.slice(5,7)-1}); },
  cl: k => { S.rg[k]=null; S.pk.open=null; },
  pick: i => { const p=S.pk; if (!p.ds||p.de){ p.ds=i; p.de=null; } else if (i<p.ds){ p.de=p.ds; p.ds=i; } else p.de=i; },
  prev: () => { const p=S.pk; if (--p.vm<0){ p.vm=11; p.vy--; } },
  next: () => { const p=S.pk; if (++p.vm>11){ p.vm=0; p.vy++; } },
  no: () => { S.pk.open=null; },
  ok: () => { const p=S.pk; if (!p.ds) return; S.rg[p.open]={s:p.ds,e:p.de||p.ds}; p.open=null; },
  rs: () => { S.rg={book:null,cin:null,cout:null}; S.pk.open=null; S.f.st=S.f.sr=S.f.cs='ALL'; S.f.cg='book'; S.dd=null; },
  po: o => { S.po=+o; }, ex: () => { S.ex=!S.ex; },
  dd: v => { const [kind,d,c]=v.split(':'); S.dd={kind,d:+d,c}; }, ddx: () => { S.dd=null; },
  us: async id => {
    const g = k => document.getElementById(k+'_'+id), u = {view_from:g('f').value||null, view_to:g('t').value||null};
    if (!g('r').disabled){ u.role=g('r').value; u.active=g('a').checked; }
    const {error} = await sb.from('profiles').update(u).eq('id',id); S.umsg = error ? error.message : 'Saved.';
  }
};
document.addEventListener('keydown', e => { if(e.key==='Escape' && S.dd){ S.dd=null; show(S.view); } });
document.addEventListener('click', async e => { const b=e.target.closest('[data-a]'); if (!b) return; const [a,...v]=b.dataset.a.split(':'); if(!A[a]) return; await A[a](v.join(':')); show(S.view); });
document.addEventListener('click', e => {
  if (!S.propMenuOpen || e.target.closest('.prop-filter')) return;
  S.propMenuOpen = false;
  S.draftProps = null;
  show(S.view);
});

document.addEventListener('change', e => {
  if(e.target.matches('[data-prop-check]')){
    const code=e.target.dataset.propCheck;
    S.draftProps=S.draftProps??(S.selectedProps===null?S.props.map(p=>p.code):[...S.selectedProps]);
    S.draftProps=e.target.checked?[...new Set([...S.draftProps,code])]:S.draftProps.filter(c=>c!==code);
    show(S.view); return;
  }
  const k=e.target.dataset.s; if (k){ S.pk[k]=+e.target.value; show(S.view); }
});

  /* Auto logout after 30 minutes of inactivity */
(() => {
  const TIMEOUT = 30 * 60 * 1000;
  let idleTimer;

  function resetIdleTimer() {
    clearTimeout(idleTimer);

    if ($('#app').hidden || !S.user) return;

    idleTimer = setTimeout(async () => {
      toast('You have been logged out due to 30 minutes of inactivity.', 'error', 5000);
      await sb.auth.signOut();
    }, TIMEOUT);
  }

  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(event => {
    document.addEventListener(event, resetIdleTimer, { passive: true });
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (session) {
      resetIdleTimer();
    } else {
      clearTimeout(idleTimer);
    }
  });
})();
</script>
